<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c5ce0">
<meta name="description" content="四级词汇背单词：4544 词完整词库，释义、例句、真题、复习、测试与学习数据统计。">
<title>四级词汇 · 背单词</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234c5ce0'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='serif'>四</text></svg>">
<style>
:root{
  --bg:#f3f5fa;
  --card:#ffffff;
  --ink:#151827;
  --ink-2:#3d4356;
  --muted:#7b8194;
  --line:#e8eaf3;
  --primary:#4c5ce0;
  --primary-deep:#3846c4;
  --primary-soft:#eceeff;
  --violet:#7c5cff;
  --green:#12a67c;
  --green-soft:#e6f7f1;
  --amber:#e8930c;
  --amber-soft:#fdf3e2;
  --red:#e2504a;
  --red-soft:#fdecea;
  --radius:20px;
  --shadow:0 1px 2px rgba(21,24,39,.04), 0 8px 24px -12px rgba(21,24,39,.14);
  --shadow-lg:0 18px 50px -18px rgba(21,24,39,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 480px at 8% -8%, #e5e9ff 0%, rgba(229,233,255,0) 62%),
    radial-gradient(700px 420px at 100% 0%, #f0eaff 0%, rgba(240,234,255,0) 60%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.55;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:#cfd4ff}

/* ---------- 布局 ---------- */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:238px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:24px 16px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,var(--primary),var(--violet));
  color:#fff;display:grid;place-items:center;font-family:Georgia,"Songti SC",serif;font-size:21px;
  box-shadow:0 8px 18px -8px rgba(76,92,224,.7);
}
.brand-text b{display:block;font-size:15px;letter-spacing:.2px}
.brand-text span{font-size:11px;color:var(--muted);letter-spacing:1.6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--ink-2);transition:.18s;font-size:14px;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;stroke-width:1.9}
.nav-item:hover{background:#f3f4fb}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .badge{
  margin-left:auto;background:var(--primary);color:#fff;font-size:11px;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;
}
.nav-item.active .badge{background:var(--primary)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.share-card{
  border-radius:16px;padding:14px;background:linear-gradient(150deg,#eef0ff,#f7f0ff);
  border:1px solid #e4e5ff;
}
.share-card b{font-size:13px;display:block;margin-bottom:2px}
.share-card p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.5}
.share-card .btn{padding:7px 12px;font-size:12px;border-radius:9px}
.side-note{font-size:11px;color:#a2a7b8;padding:0 4px;line-height:1.6}

main{margin-left:238px;padding:26px 40px 90px;max-width:1080px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.16s;
}
.icon-btn:hover{color:var(--primary);border-color:#d6d9ff;background:#fbfbff}
.icon-btn svg{width:18px;height:18px;stroke-width:1.9}
.streak-chip{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:11px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
}
.streak-chip b{color:var(--amber);font-size:14px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;
  transition:.16s;white-space:nowrap;border:1px solid transparent;
}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn.primary{background:linear-gradient(145deg,var(--primary),#5c6bf0);color:#fff;box-shadow:0 8px 20px -10px rgba(76,92,224,.9)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px rgba(76,92,224,.9)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:#e2e5ff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink-2)}
.btn.ghost:hover{border-color:#cfd4ee}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn.lg{padding:13px 24px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.seg{display:inline-flex;background:#f1f2f9;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500;transition:.16s}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 2px 8px rgba(21,24,39,.08)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12px;background:#f2f3fa;color:var(--muted);border:1px solid transparent;
}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:#dfe2ff;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.divider{height:1px;background:var(--line);margin:16px 0}
.pos{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#8b6cd8;
  background:#f3efff;border-radius:5px;padding:1px 5px;margin-right:6px;text-transform:lowercase;
  vertical-align:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---------- 学习首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:26px 28px 24px;color:#fff;
  background:linear-gradient(130deg,#3b46cf 0%,#5a5bea 45%,#7c5cff 100%);
  box-shadow:0 24px 50px -28px rgba(58,68,207,.9);
}
.hero:after{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-120px;top:-170px;
  background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 68%);
}
.hero:before{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:70px;bottom:-160px;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);
}
.hero-date{font-size:12px;opacity:.82;letter-spacing:.6px;position:relative}
.hero h1{font-size:27px;margin:7px 0 4px;letter-spacing:-.4px;position:relative;font-weight:700}
.hero p{margin:0;font-size:13px;opacity:.85;position:relative}
.hero-row{display:flex;gap:26px;margin:22px 0 20px;position:relative;flex-wrap:wrap}
.hero-stat b{display:block;font-size:24px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:11.5px;opacity:.82}
.hero-btn{background:#fff;color:var(--primary);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);position:relative}
.hero-btn:hover{background:#fff;transform:translateY(-1px)}
.hero-btn.alt{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.hero-btn.alt:hover{background:rgba(255,255,255,.24)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.panel{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.panel-title{font-size:14px;font-weight:700;letter-spacing:.1px}
.panel-desc{font-size:12.5px;color:var(--muted);margin:2px 0 14px;line-height:1.6}
.goal-chips{display:flex;gap:6px;flex-wrap:wrap}
.hint-card{
  margin-top:18px;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;
  border-radius:16px;background:#fffdf7;border:1px solid #f4e9cf;color:#8a6d2f;font-size:12.5px;line-height:1.65;
}
.hint-card b{color:#6d5318}

/* ---------- 学习卡片 ---------- */
.session-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.session-progress{flex:1;height:6px;border-radius:99px;background:#e7e9f4;overflow:hidden}
.session-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--violet));transition:width .35s}
.session-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.study-card{
  padding:26px 30px 22px;min-height:440px;max-height:calc(100vh - 185px);overflow:hidden;
  display:flex;flex-direction:column;animation:rise .32s cubic-bezier(.22,.9,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.word-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.headword{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:42px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px;word-break:break-word;
}
.phon-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.speak{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--primary);
  background:var(--primary-soft);transition:.16s;
}
.speak:hover{background:#e0e4ff;transform:scale(1.05)}
.speak svg{width:15px;height:15px}
.word-badge{
  font-size:11px;padding:4px 9px;border-radius:99px;background:var(--red-soft);color:var(--red);
  font-weight:600;flex:none;
}
.reveal-area{
  flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:20px 6px 6px 0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d8dbe8 transparent;
}
.reveal-area::-webkit-scrollbar{width:5px}
.reveal-area::-webkit-scrollbar-thumb{background:#dcdfeb;border-radius:99px}
.front-hint{
  text-align:center;padding:28px 0;color:var(--muted);cursor:pointer;user-select:none;margin:auto 0;width:100%;
}
.front-hint .eye{
  width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:#f4f5fb;color:#9aa0b6;animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:translateY(0);box-shadow:0 0 0 0 rgba(76,92,224,.12)}50%{transform:translateY(-3px);box-shadow:0 0 0 12px rgba(76,92,224,0)}}
.front-hint b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:3px}
.front-hint span{font-size:12px}
.senses{animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sense{display:flex;gap:2px;padding:5px 0;font-size:16.5px;color:var(--ink);line-height:1.65}
.sense .pos{margin-top:4px}
.en-def{font-size:12.5px;color:#9096aa;line-height:1.6;margin:2px 0 6px;font-style:italic}
.block{margin-top:16px;padding-top:14px;border-top:1px dashed #e6e8f2}
.block-label{font-size:11px;color:#9aa0b6;letter-spacing:1.2px;font-weight:700;margin-bottom:7px}
.example{font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.example .en{font-family:Georgia,"Times New Roman",serif}
.example .cn{font-size:12.5px;color:var(--muted);margin-top:3px}
.example + .example{margin-top:9px}
.example em{font-style:normal;color:var(--primary);font-weight:600;background:#f0f2ff;border-radius:3px;padding:0 2px}
.phrase{display:flex;gap:10px;font-size:13px;padding:3px 0}
.phrase .en{font-family:Georgia,serif;color:var(--ink-2);white-space:nowrap}
.phrase .cn{color:var(--muted)}
.memo{font-size:13px;color:#6b5b9a;background:#f8f5ff;border-radius:10px;padding:10px 12px;line-height:1.65}
.exam{font-size:13px;line-height:1.7;color:var(--ink-2)}
.exam .src{font-size:11px;color:#9aa0b6;margin-top:4px}
.rate-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rate-btn{
  padding:11px 8px;border-radius:13px;text-align:center;border:1px solid transparent;transition:.16s;
}
.rate-btn b{display:block;font-size:14px;font-weight:600}
.rate-btn span{display:block;font-size:10.5px;opacity:.68;margin-top:1px}
.rate-btn:hover{transform:translateY(-1px)}
.rate-btn:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.35)}
.rate-btn.dont{background:var(--red-soft);color:var(--red)}
.rate-btn.dont:hover{background:#fbe0de}
.rate-btn.fuzzy{background:var(--amber-soft);color:#b8730a}
.rate-btn.fuzzy:hover{background:#fbeacf}
.rate-btn.know{background:var(--green-soft);color:#0b8a67}
.rate-btn.know:hover{background:#d9f2e9}
.keyboard-hint{text-align:center;font-size:11px;color:#a8adbd;margin-top:12px}
.keyboard-hint kbd{
  font-family:inherit;background:#f2f3f9;border:1px solid #e5e7f0;border-radius:4px;
  padding:0 4px;font-size:10px;color:#8a90a4;
}
.session-summary{text-align:center;padding:44px 30px 36px;animation:rise .32s}
.summary-icon{
  width:66px;height:66px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(145deg,#e8f8f2,#d5f2e8);color:var(--green);
}
.session-summary h2{font-size:23px;margin:0 0 6px;letter-spacing:-.3px}
.session-summary p{margin:0;color:var(--muted);font-size:13px}
.summary-stats{display:flex;justify-content:center;gap:28px;margin:26px 0 28px}
.summary-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.summary-stats span{font-size:11.5px;color:var(--muted)}
.summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- 复习 ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.section-title{font-size:15px;font-weight:700}
.due-card{padding:24px;text-align:center}
.due-num{font-size:52px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,var(--primary),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.due-label{font-size:12.5px;color:var(--muted);margin:7px 0 18px}
.due-preview{margin-top:18px;text-align:left;border-top:1px solid var(--line);padding-top:6px}
.word-row{
  display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f1f2f8;
  cursor:pointer;transition:.14s;width:100%;text-align:left;
}
.word-row:last-child{border-bottom:0}
.word-row:hover{background:#fafbff}
.word-row .w{font-family:Georgia,serif;font-size:16.5px;min-width:0;white-space:nowrap}
.word-row .m{font-size:12.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word-row .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.new{background:#c8ccdb}
.dot.learning{background:var(--amber)}
.dot.mastered{background:var(--green)}
.dot.book{background:var(--red)}
.empty-state{padding:52px 24px;text-align:center}
.empty-state .ic{
  width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:#f1f3fa;color:#a3a9bd;
}
.empty-state h3{margin:0 0 5px;font-size:16px}
.empty-state p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.tiny-progress{font-size:11px;color:#a3a9bd}

/* ---------- 测试 ---------- */
.quiz-setup{padding:26px 28px}
.quiz-setup h2{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
.quiz-setup .muted{margin:0 0 22px;font-size:12.5px}
.form-row{margin-bottom:20px}
.form-label{font-size:12px;color:#8b91a5;font-weight:600;letter-spacing:.4px;margin-bottom:8px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.quiz-card{padding:26px 28px}
.q-label{font-size:11px;letter-spacing:1.4px;color:#9aa0b6;font-weight:700;margin-bottom:12px}
.q-prompt{font-size:32px;line-height:1.3;margin-bottom:22px;letter-spacing:-.3px;word-break:break-word}
.q-prompt.cn{font-family:inherit;font-size:21px;line-height:1.55;font-weight:600}
.q-prompt .pos{vertical-align:3px}
.options{display:flex;flex-direction:column;gap:9px}
.option{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:12px;
  border:1px solid var(--line);background:#fff;text-align:left;transition:.14s;font-size:14.5px;line-height:1.5;
}
.option:hover{border-color:#c8cdf8;background:#fbfbff}
.option .k{
  width:23px;height:23px;border-radius:7px;background:#f1f3fa;color:#8b91a5;flex:none;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;margin-top:-1px;
}
.option.correct{border-color:#a8e0cd;background:#f1fbf7}
.option.correct .k{background:var(--green);color:#fff}
.option.wrong{border-color:#f3c4c1;background:#fdf3f2}
.option.wrong .k{background:var(--red);color:#fff}
.option.dim{opacity:.55}
.option:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;background:#f8f9fd;border:1px solid var(--line);animation:fade .2s}
.feedback b{font-size:13.5px}
.feedback .ans{font-size:13px;color:var(--ink-2);margin-top:3px}
.feedback .eg{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.result{padding:32px 28px;text-align:center}
.donut{
  width:130px;height:130px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  position:relative;
}
.donut:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.donut span{position:relative;z-index:1;font-size:31px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.result h2{margin:0 0 4px;font-size:21px}
.result p{margin:0;color:var(--muted);font-size:12.5px}
.result .summary-actions{margin-top:24px}
.wrong-box{margin-top:24px;text-align:left;border-top:1px solid var(--line);padding-top:18px}
.wrong-box h3{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.wrong-item{padding:11px 0;border-bottom:1px solid #f2f3f9;font-size:13.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wrong-item .w{font-family:Georgia,serif;font-size:16px;color:var(--red)}
.wrong-item .right{color:var(--ink-2)}
.wrong-item .yours{font-size:12px;color:#a3a9bd;text-decoration:line-through}

/* ---------- 数据 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px 18px 16px}
.stat .k{font-size:11.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b small{font-size:12px;font-weight:500;color:#a3a9bd;letter-spacing:0;margin-left:3px}

<script>
(function(){
'use strict';

/* ================= 基础工具 ================= */
var W = window.CET4_WORDS || [];
var byWord = new Map();
W.forEach(function(w){ byWord.set(w.w.toLowerCase(), w); });

var DAY = 86400000, MIN = 60000;
var INTERVALS = [0, 1, 3, 7, 15, 30, 60, 120, 240];
var MASTER = 6;
var KEY = {rec:'cet4.rec.v1', act:'cet4.act.v1', meta:'cet4.meta.v1'};

var $ = function(s, r){ return (r||document).querySelector(s); };
var esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
var dkey = function(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
};
function load(key, def){
  try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : def; }catch(e){ return def; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
var records = load(KEY.rec, {});
var activity = load(KEY.act, {});
var meta = load(KEY.meta, {goal:20, quizTotal:0, quizCorrect:0});
if(typeof meta.goal !== 'number') meta.goal = 20;
if(typeof meta.quizTotal !== 'number') meta.quizTotal = 0;
if(typeof meta.quizCorrect !== 'number') meta.quizCorrect = 0;

function persist(){
  save(KEY.rec, records); save(KEY.act, activity); save(KEY.meta, meta);
}
function getRec(word){
  return records[String(word).toLowerCase()] || null;
}
function ensureRec(word){
  var k = String(word).toLowerCase();
  if(!records[k]){
    records[k] = {s:0, d:0, n:0, c:0, w:0, b:false, t:0};
  }
  return records[k];
}
function statusOf(word){
  var r = getRec(word);
  if(!r || !r.n) return 'new';
  return r.s >= MASTER ? 'mastered' : 'learning';
}
function logAct(kind, n){
  var k = dkey();
  if(!activity[k]) activity[k] = {learned:0, reviewed:0, quiz:0, correct:0};
  activity[k][kind] += (n == null ? 1 : n);
}
function todayAct(){
  return activity[dkey()] || {learned:0, reviewed:0, quiz:0, correct:0};
}
function hasAct(k){
  var a = activity[k];
  return !!(a && ((a.learned||0) + (a.reviewed||0) + (a.quiz||0) > 0));
}
function streak(){
  var n = 0, t = Date.now();
  if(!hasAct(dkey(new Date(t)))) t -= DAY;
  while(hasAct(dkey(new Date(t)))){ n++; t -= DAY; }
  return n;
}
function dueWords(){
  var now = Date.now(), out = [];
  for(var i=0;i<W.length;i++){
    var r = getRec(W[i].w);
    if(r && r.s > 0 && r.d <= now) out.push(W[i]);
  }
  out.sort(function(a,b){ return (getRec(a.w).d||0) - (getRec(b.w).d||0); });
  return out;
}
function bookWords(){
  var out = [];
  for(var i=0;i<W.length;i++){
    var r = getRec(W[i].w);
    if(r && r.b) out.push(W[i]);
  }
  return out;
}
function newWords(){
  var out = [];
  for(var i=0;i<W.length;i++){ if(!getRec(W[i].w)) out.push(W[i]); }
  return out;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1)), tmp = a[i];
    a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function meaningText(w, max){
  if(!w || !w.t || !w.t[0]) return '';
  var s = (w.t[0].p ? w.t[0].p + '. ' : '') + w.t[0].c;
  if(max && s.length > max) s = s.slice(0, max) + '…';
  return s;
}
function firstMeaning(w, max){
  if(!w || !w.t || !w.t[0]) return '';
  var s = w.t[0].c;
  if(max && s.length > max) s = s.slice(0, max) + '…';
  return s;
}
function niceDate(ts){
  var d = new Date(ts), now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  var tmr = new Date(Date.now() + DAY);
  if(d.toDateString() === tmr.toDateString()) return '明天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  return (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function greet(){
  var h = new Date().getHours();
  if(h < 6) return '夜深了，也别停下';
  if(h < 11) return '早上好，开始今天的积累';
  if(h < 14) return '中午好，来一组单词';
  if(h < 19) return '下午好，继续保持';
  return '晚上好，今天还没背完吧';
}
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持发音'); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .88;
    var voices = window.speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      if(/en[-_]US/i.test(voices[i].lang) && /Google|Samantha|Natural|Microsoft/i.test(voices[i].name)){
        u.voice = voices[i]; break;
      }
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

var ICONS = {
  study:'<path d="M2 4.5h6.5A3.5 3.5 0 0 1 12 8v12a3 3 0 0 0-3-3H2z"/><path d="M22 4.5h-6.5A3.5 3.5 0 0 0 12 8v12a3 3 0 0 1 3-3h7z"/>',
  review:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 8v5l3 2"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.1-1.5 2.3"/><line x1="12" y1="17.2" x2="12" y2="17.3"/>',
  stats:'<line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="8"/>',
  lib:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  speaker:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  back:'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  close:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  fire:'<path d="M12 2s4 4.5 4 8a4 4 0 0 1-8 0c0-1.5 1-3 1-3s-3 2-3 5a6 6 0 0 0 12 0c0-4-6-10-6-10z"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'
};
ICONS.library = ICONS.lib;
function icon(name, size){
  var s = size || 20;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||ICONS.study)+'</svg>';
}

/* ================= 导航 ================= */
var TABS = [
  {id:'study', name:'背单词', sub:'每天一点，四级词汇稳步积累。'},
  {id:'review', name:'复习', sub:'按记忆曲线安排复习，遗忘更少。'},
  {id:'quiz', name:'测试', sub:'即时检验，答错的词自动加入生词本。'},
  {id:'stats', name:'数据', sub:'学习记录与掌握情况一目了然。'},
  {id:'library', name:'词库', sub:'4544 个四级词汇，可检索与查看详情。'}
];
var state = {
  tab: 'study',
  session: null,
  reviewMode: 'due',
  lib: {q:'', filter:'all', letter:'', limit:60},
  quizSetup: {type:'w2m', count:10, scope:'all'},
  quiz: null,
  sheet: null
};

function renderNav(){
  var nav = TABS.map(function(t){
    var badge = '';
    if(t.id === 'review'){
      var n = dueWords().length;
      if(n) badge = '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>';
    }
    return '<button class="nav-item ' + (state.tab===t.id?'active':'') + '" data-act="tab" data-tab="'+t.id+'">' +
      icon(t.id) + '<span>' + t.name + '</span>' + badge + '</button>';
  }).join('');

  var tabbar = TABS.map(function(t){

      var n = dueWords().length;
      if(n) badge = '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>';
    }
    return '<button class="tab ' + (state.tab===t.id?'active':'') + '" data-act="tab" data-tab="'+t.id+'">' +
      icon(t.id, 21) + '<span>' + t.name + '</span>' + badge + '</button>';
  }).join('');

function switchTab(tab){
  if(tab === state.tab){ window.scrollTo({top:0, behavior:'smooth'}); return; }
  state.tab = tab;
  if(tab === 'study' && state.session) state.session = null;
  history.replaceState(null, '', '#' + tab);

/* ================= 渲染入口 ================= */
function renderView(){
  var v = $('#view');
  if(!W.length){
    v.innerHTML = '<div class="card empty-state"><div class="ic">'+icon('search',24)+'</div><h3>词库未加载</h3><p>请确认 words.js 与本页面在同一目录。</p></div>';

function masteredCount(){
  var n = 0;
  for(var k in records){ if(records.hasOwnProperty(k) && records[k].n && records[k].s >= MASTER) n++; }
  return n;
}

function startSession(kind, extra){
  var list = [];
  if(kind === 'study'){
    var remaining = Math.max(0, meta.goal - todayAct().learned);
    var count = extra ? extra : remaining;
    if(!count){ toast('今日新词已完成，可选择「再学 10 个」'); return; }
    list = shuffle(newWords()).slice(0, Math.min(count, 40));
  }else if(kind === 'review'){
    list = dueWords().slice(0, 40);
  }else if(kind === 'book'){
    list = bookWords().sort(function(a,b){
      var ra = getRec(a.w), rb = getRec(b.w);
      return (ra.d||0) - (rb.d||0);
    }).slice(0, 40);
  }
  if(!list.length){ toast(kind==='review'?'暂无到期单词':'生词本还是空的'); return; }
  state.session = {kind:kind, words:list, i:0, revealed:false, stats:{know:0,fuzzy:0,dont:0}, startedAt:Date.now()};
  renderView();
}

function renderSession(v){
  var s = state.session;
  if(s.i >= s.words.length) return renderSummary(v);
  var w = s.words[s.i];
  var r = getRec(w.w);
  var pct = Math.round(s.i / s.words.length * 100);
  var stage = r ? r.s : 0;
  var knowNext = INTERVALS[Math.min(8, stage + 1)];

  var html = '';
  html += '<div class="session-head">';
  html += '<button class="icon-btn" data-act="exit-session" aria-label="退出">' + icon('back',18) + '</button>';

  html += '</div>';

  html += '<div class="card study-card" data-act="reveal">';

  html += '<h1 class="headword">' + esc(w.w) + '</h1>';

  html += '</div>';

    html += '<b>先在心里回想一下</b><span>点击卡片查看释义与例句</span></div>';

  }

function wordDetailHTML(w, opts){
  opts = opts || {};
  var html = '<div class="senses">';
  w.t.forEach(function(t){
    html += '<div class="sense">' + (t.p ? '<span class="pos">' + esc(t.p) + '</span>' : '') + esc(t.c) + '</div>';
    if(t.e) html += '<div class="en-def">' + esc(t.e) + '</div>';
  });
  html += '</div>';

  if(w.s && w.s.length){
    html += '<div class="block"><div class="block-label">例句</div>';
    w.s.forEach(function(s){
      html += '<div class="example"><div class="en">' + highlight(s.e, w.w) + '</div>';
      if(s.c) html += '<div class="cn">' + esc(s.c) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  if(w.m){
    html += '<div class="block"><div class="block-label">助记</div><div class="memo">' + esc(w.m) + '</div></div>';
  }
  if(w.x && w.x.e && opts.full !== false){
    html += '<div class="block"><div class="block-label">真题例句</div><div class="exam">' + highlight(w.x.e, w.w) + '</div>';
    if(w.x.s) html += '<div class="src">' + esc(w.x.s) + '</div>';
    html += '</div>';
  }
  if(w.ph && w.ph.length){
    html += '<div class="block"><div class="block-label">常见短语</div>';
    w.ph.forEach(function(p){
      html += '<div class="phrase"><span class="en">' + esc(p.e) + '</span><span class="cn">' + esc(p.c) + '</span></div>';
    });
    html += '</div>';
  }
  if(w.syn && w.syn.length){
    html += '<div class="block"><div class="block-label">同近义词</div>';
    w.syn.forEach(function(s){
      html += '<div class="phrase"><span class="cn">' + esc(s.c || '') + '</span><span class="en">' + esc(s.h.join(' · ')) + '</span></div>';
    });
    html += '</div>';
  }
  if(opts.meta){
    var r = getRec(w.w);
    html += '<div class="block"><div class="block-label">学习状态</div>';
    var stt = statusOf(w.w);
    var label = stt === 'mastered' ? '已掌握' : (stt === 'learning' ? '学习中' : '未学习');
    html += '<div class="small muted">' + label + (r && r.n ? ' · 复习 ' + r.n + ' 次 · 正确 ' + r.c + ' 次' : '') +
      (r && r.d && stt !== 'new' ? ' · 下次复习 ' + niceDate(r.d) : '') + '</div></div>';
  }
  return html;
}

function highlight(text, word){
  var safe = esc(text);
  if(!word) return safe;
  try{
    var re = new RegExp('\\b(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')\\b', 'gi');
    return safe.replace(re, '<em>$1</em>');
  }catch(e){ return safe; }
}

function rate(level){
  var s = state.session;
  if(!s || s.i >= s.words.length) return;
  var w = s.words[s.i];
  var r = ensureRec(w.w);
  var isNew = !r.n;
  r.n += 1;
  r.t = Date.now();
  if(level === 'know'){
    r.s = Math.min(8, (r.s || 0) + 1);
    r.c += 1;
    r.d = Date.now() + INTERVALS[r.s] * DAY;
  }else if(level === 'fuzzy'){
    r.s = Math.max(1, r.s || 0);
    r.d = Date.now() + 10 * MIN;
  }else{
    r.s = 1;
    r.d = Date.now() + 10 * MIN;
    r.w += 1;
    r.b = true;
  }
  logAct(isNew ? 'learned' : 'reviewed');
  s.stats[level] += 1;
  s.i += 1;
  s.revealed = false;
  persist();
  renderView();
}

function nextDueTime(){
  var min = null;
  for(var k in records){
    if(!records.hasOwnProperty(k)) continue;
    var r = records[k];
    if(r.s > 0 && r.d > Date.now() && (min === null || r.d < min)) min = r.d;
  }
  return min ? niceDate(min) : '';
}

function wordRowHTML(w, showRemove){

function createQuiz(type, count, scope){
  var pool = W.filter(function(w){ return w.t && w.t[0] && w.t[0].c; });
  if(scope === 'book'){
    pool = pool.filter(function(w){ var r = getRec(w.w); return r && r.b; });
  }else if(scope === 'learned'){
    pool = pool.filter(function(w){ return !!getRec(w.w); });
  }
  if(pool.length < 8) pool = W.filter(function(w){ return w.t && w.t[0] && w.t[0].c; });

  pool = shuffle(pool);
  var n = Math.min(count, pool.length);
  var questions = [];
  for(var i=0;i<n;i++){
    var w = pool[i];
    var t = type === 'mix' ? (Math.random() < .5 ? 'w2m' : 'm2w') : type;
    var correctText = t === 'w2m' ? meaningText(w, 60) : w.w;
    var opts = [correctText], used = {};
    used[correctText.toLowerCase()] = 1;
    var guard = 0;
    while(opts.length < 4 && guard < 500){
      guard++;
      var d = W[Math.floor(Math.random()*W.length)];
      if(!d.t || !d.t[0] || !d.t[0].c) continue;
      var v2 = t === 'w2m' ? meaningText(d, 60) : d.w;
      if(!v2 || used[v2.toLowerCase()]) continue;
      used[v2.toLowerCase()] = 1;
      opts.push(v2);
    }
    if(opts.length < 2) continue;
    opts = shuffle(opts);
    questions.push({
      w: w.w,
      word: w,
      type: t,
      prompt: t === 'w2m' ? w.w : meaningText(w, 120),
      options: opts,
      answer: opts.indexOf(correctText),
      selected: null
    });
  }
  return {questions:questions, i:0, correct:0, finished:false, type:type, scope:scope, startedAt:Date.now()};
}

function startQuiz(){
  var s = state.quizSetup;
  state.quiz = createQuiz(s.type, s.count, s.scope);
  if(!state.quiz.questions.length){ toast('词库数据不足，无法生成题目'); state.quiz = null; return; }
  renderView();
}

function renderQuizQuestion(v){
  var q = state.quiz;
  var cur = q.questions[q.i];
  var total = q.questions.length;
  var pct = Math.round(q.i / total * 100);
  var answered = cur.selected !== null;

  var html = '<div class="quiz-top"><span>第 ' + (q.i+1) + ' / ' + total + ' 题</span><span>已答对 ' + q.correct + ' 题</span></div>';
  html += '<div class="session-progress" style="margin-bottom:16px"><i style="width:' + pct + '%"></i></div>';
  html += '<div class="card quiz-card">';
  html += '<div class="q-label">' + (cur.type === 'w2m' ? '选择正确的中文释义' : '选择正确的英文单词') + '</div>';
  html += '<div class="q-prompt ' + (cur.type === 'm2w' ? 'cn' : '') + '">' + esc(cur.prompt) + '</div>';
  html += '<div class="options">';
  cur.options.forEach(function(o, idx){
    var cls = 'option';
    if(answered){
      if(idx === cur.answer) cls += ' correct';
      else if(idx === cur.selected) cls += ' wrong';
      else cls += ' dim';
    }
    html += '<button class="' + cls + '" data-act="quiz-answer" data-idx="' + idx + '"' + (answered?' disabled':'') + '>';
    html += '<span class="k">' + 'ABCD'[idx] + '</span><span>' + esc(o) + '</span></button>';
  });
  html += '</div>';

  if(answered){
    var ok = cur.selected === cur.answer;
    html += '<div class="feedback"><b style="color:' + (ok ? 'var(--green)' : 'var(--red)') + '">' + (ok ? '回答正确' : '回答错误') + '</b>';
    html += '<div class="ans">正确答案：' + esc(cur.options[cur.answer]) + '</div>';
    var wd = cur.word;
    if(wd && wd.s && wd.s[0]) html += '<div class="eg">' + esc(wd.s[0].e) + (wd.s[0].c ? '<br>' + esc(wd.s[0].c) : '') + '</div>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:flex-end;margin-top:16px">';
    html += '<button class="btn primary" data-act="quiz-next">' + (q.i === total-1 ? '查看结果' : '下一题') + ' ' + icon('arrow',15) + '</button></div>';
  }
  html += '</div>';
  v.innerHTML = html;
}

function answerQuiz(idx){
  var q = state.quiz;
  if(!q || q.finished) return;
  var cur = q.questions[q.i];
  if(cur.selected !== null) return;
  cur.selected = idx;
  var ok = idx === cur.answer;
  if(ok) q.correct += 1;
  meta.quizTotal += 1;
  if(ok) meta.quizCorrect += 1;
  logAct('quiz');
  if(ok) logAct('correct');
  var r = ensureRec(cur.w);
  r.n += 1;
  r.t = Date.now();
  if(ok) r.c += 1;
  else { r.w += 1; r.b = true; }
  persist();
  renderView();
}

function nextQuestion(){
  var q = state.quiz;
  if(!q) return;
  if(q.i >= q.questions.length - 1){ q.finished = true; }
  else q.i += 1;
  renderView();
}

function renderQuizResult(v){
  var q = state.quiz;
  var total = q.questions.length;
  var pct = Math.round(q.correct / total * 100);
  var wrong = q.questions.filter(function(x){ return x.selected !== x.answer; });
  var color = pct >= 80 ? 'var(--green)' : (pct >= 60 ? 'var(--amber)' : 'var(--red)');

  var html = '<div class="card result">';
  html += '<div class="donut" style="background:conic-gradient(' + color + ' ' + (pct*3.6) + 'deg,#eceef7 0)"><span>' + pct + '%</span></div>';
  html += '<h2>答对 ' + q.correct + ' / ' + total + ' 题</h2>';
  html += '<p>用时 ' + Math.max(1, Math.round((Date.now()-q.startedAt)/60000)) + ' 分钟' + (wrong.length ? ' · ' + wrong.length + ' 个词已加入生词本' : ' · 全部正确，非常棒') + '</p>';
  html += '<div class="summary-actions"><button class="btn primary" data-act="quiz-restart">再测一次</button>';
  html += '<button class="btn soft" data-act="quiz-again-wrong">复习错题</button>';
  html += '<button class="btn ghost" data-act="quiz-exit">返回</button></div>';

  if(wrong.length){
    html += '<div class="wrong-box"><h3>错题回顾</h3>';
    wrong.forEach(function(x){
      var right = x.options[x.answer], yours = x.selected !== null ? x.options[x.selected] : '未作答';
      html += '<div class="wrong-item"><span class="w">' + esc(x.w) + '</span>';
      html += '<span class="right">' + esc(right) + '</span>';
      if(x.selected !== x.answer) html += '<span class="yours">' + esc(yours) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  v.innerHTML = html;
}

function statCard(k, val, suffix, foot){
  return '<div class="card stat"><div class="k">' + k + '</div><b>' + val + (suffix||'') + '</b><div class="foot">' + foot + '</div></div>';
}

function chartHTML(){
  var days = [];
  for(var i=13;i>=0;i--){
    var d = new Date(Date.now() - i*DAY), k = dkey(d), a = activity[k] || {};
    days.push({
      label: (d.getMonth()+1) + '/' + d.getDate(),
      learned: a.learned || 0,
      reviewed: a.reviewed || 0
    });
  }
  var max = 5;
  days.forEach(function(d){ max = Math.max(max, d.learned + d.reviewed); });

  var html = '<div class="chart">';
  days.forEach(function(d, idx){
    var total = d.learned + d.reviewed;
    var h = total ? Math.max(4, Math.round(total/max*100)) : 0;
    html += '<div class="bar-col">';
    html += '<div class="bar-stack' + (total ? '' : ' empty') + '">';
    if(total){
      html += '<i class="learn" style="height:' + (d.learned/total*100) + '%"></i>';
      html += '<i class="rev" style="height:' + (d.reviewed/total*100) + '%"></i>';
    }
    html += '</div>';
    html += '<em>' + (idx % 2 === 0 || idx === days.length-1 ? d.label : '') + '</em>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function exportData(){
  var payload = {version:1, exportedAt:new Date().toISOString(), records:records, activity:activity, meta:meta, total:W.length};
  var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cet4-progress-' + dkey() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('学习记录已导出');
}

function importData(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || !data.records) throw new Error('bad');
      if(!confirm('导入将覆盖当前学习记录，确定继续？')) return;
      records = data.records || {};
      activity = data.activity || {};
      meta = data.meta || {goal:20, quizTotal:0, quizCorrect:0};
      persist();
      renderView();
      toast('导入成功');
    }catch(err){
      toast('文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function renderLibrary(v){
  var lib = state.lib;
  var html = '<div class="lib-tools">';
  html += '<div class="search">' + icon('search',16) + '<input id="libSearch" placeholder="搜索单词或中文释义…" value="' + esc(lib.q) + '"></div>';
  html += '</div>';
  html += '<div class="letter-bar"><button class="' + (!lib.letter?'on':'') + '" data-act="lib-letter" data-letter="">全部</button>';
  for(var i=65;i<=90;i++){
    var ch = String.fromCharCode(i);
    html += '<button class="' + (lib.letter===ch?'on':'') + '" data-act="lib-letter" data-letter="' + ch + '">' + ch + '</button>';
  }
  html += '</div>';
  html += '<div class="seg" style="margin-bottom:12px">';
  [['all','全部'],['new','未学'],['learning','学习中'],['mastered','已掌握'],['book','生词本']].forEach(function(f){
    html += '<button class="' + (lib.filter===f[0]?'on':'') + '" data-act="lib-filter" data-filter="' + f[0] + '">' + f[1] + '</button>';
  });
  html += '</div>';

  var list = filterLibrary();
  html += '<div class="lib-count">共 ' + list.length + ' 个单词' + (lib.q ? ' · 关键词「' + esc(lib.q) + '」' : '') + '</div>';
  html += '<div class="card lib-list">';
  var shown = list.slice(0, lib.limit);
  if(!shown.length){
    html += '<div class="empty-state"><div class="ic">' + icon('search',22) + '</div><h3>没有找到单词</h3><p>换个关键词或筛选条件试试。</p></div>';
  }else{
    shown.forEach(function(w){ html += wordRowHTML(w); });
    if(list.length > shown.length){
      html += '<div class="load-more"><button class="btn ghost" data-act="lib-more">显示更多（剩余 ' + (list.length - shown.length) + '）</button></div>';
    }
  }
  html += '</div>';
  v.innerHTML = html;

  var input = $('#libSearch');
  if(input){
    input.addEventListener('input', function(){
      state.lib.q = this.value.trim();
      state.lib.limit = 60;
      var pos = this.selectionStart;
      renderView();
      var el = $('#libSearch');
      if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
    });
  }
}

function filterLibrary(){
  var lib = state.lib, q = lib.q.toLowerCase();
  var out = [];
  for(var i=0;i<W.length;i++){
    var w = W[i];
    if(lib.letter){
      var c = w.w.charAt(0).toUpperCase();
      if((lib.letter === '#' ? !/[A-Z]/.test(c) : c !== lib.letter)) continue;
    }
    if(q){
      var hay = w.w.toLowerCase() + ' ' + w.t.map(function(t){ return t.c; }).join(' ');
      if(hay.toLowerCase().indexOf(q) < 0) continue;
    }
    if(lib.filter !== 'all'){
      var st = statusOf(w.w), r = getRec(w.w);
      if(lib.filter === 'book'){ if(!(r && r.b)) continue; }
      else if(st !== lib.filter) continue;
    }
    out.push(w);
  }
  return out;
}

function closeSheet(){

}

/* ================= 分享 ================= */
function drawQR(url){
  var box = $('#qrbox');
  box.innerHTML = '';
  if(!url){ box.innerHTML = '<div class="small muted">请先填写链接</div>'; return; }
  if(window.QRCode){
    try{
      new QRCode(box, {
        text: url, width: 200, height: 200,
        colorDark: '#151827', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
      var c = box.querySelector('canvas');
      if(c){ c.style.width = '100%'; c.style.height = '100%'; }
      return;
    }catch(e){}
  }
  box.innerHTML = '<img alt="二维码" style="width:100%" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=' + encodeURIComponent(url) + '">';
}

function openShare(){
  var url = location.href.split('#')[0];
  $('#shareLink').value = url;
  var warn = '', tip = '把本页目录部署到任意静态服务器，或在本机开启 HTTP 服务后用局域网地址访问，即可扫码打开。学习记录保存在各自设备的浏览器中。';
  if(location.protocol === 'file:'){
    warn = '<div class="share-warn">当前是本地文件打开（file://），二维码链接无法被手机访问。请改用 http(s) 地址访问本页面后再生成二维码。</div>';
    $('#qrbox').innerHTML = '<div class="small muted" style="padding:20px;text-align:center">通过网址访问后可显示二维码</div>';
  }else{
    drawQR(url);
  }
  $('#shareWarn').innerHTML = warn;
  $('#shareTip').textContent = tip;
  $('#shareModal').classList.add('show');
  $('#overlay').classList.add('show');
}

function regenQR(){
  var v = $('#shareLink').value.trim();
  if(!v){ toast('请先填写链接'); return; }
  drawQR(v);
  toast('二维码已更新');

function copyLink(){
  var input = $('#shareLink');
  input.select();
  input.setSelectionRange(0, 99999);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  if(!ok && navigator.clipboard){
    navigator.clipboard.writeText(input.value).then(function(){ toast('链接已复制'); }, function(){ toast('复制失败，请长按选择'); });
    return;
  }
  toast(ok ? '链接已复制' : '复制失败，请长按选择');
}

function downloadQR(){
  var box = $('#qrbox');
  var canvas = box.querySelector('canvas');
  if(!canvas){
    var img = box.querySelector('img');
    if(img){ window.open(img.src, '_blank'); return; }

  }
  var a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'cet4-qrcode.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast('二维码已保存');
}

/* ================= 事件 ================= */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');
  var word = el.getAttribute('data-word');

  switch(act){
    case 'tab': switchTab(el.getAttribute('data-tab')); break;
    case 'share': openShare(); break;
    case 'copy-link': copyLink(); break;
    case 'regen-qr': regenQR(); break;
    case 'download-qr': downloadQR(); break;
    case 'close-layers':
      $('#shareModal').classList.remove('show');
      closeSheet();
      $('#overlay').classList.remove('show');
      break;
    case 'close-sheet': closeSheet(); $('#overlay').classList.remove('show'); break;
    case 'speak':
      e.stopPropagation();
      speak(word || '');
      break;
    case 'start-study': startSession('study'); break;
    case 'start-extra': startSession('study', 10); break;
    case 'start-extra-now': startSession('study', 10); break;
    case 'start-review': startSession('review'); break;
    case 'start-book': startSession('book'); break;
    case 'set-goal':
      meta.goal = parseInt(el.getAttribute('data-goal'), 10) || 20;
      persist(); renderView(); toast('每日目标已设为 ' + meta.goal + ' 词');
      break;
    case 'exit-session':
      state.session = null;
      renderView();
      break;
    case 'go-review':
      state.session = null; switchTab('review');
      break;
    case 'reveal':
      if(state.session && !state.session.revealed){
        state.session.revealed = true;
        renderView();
      }
      break;
    case 'rate':
      e.stopPropagation();
      rate(el.getAttribute('data-level'));
      break;
    case 'review-mode':
      state.reviewMode = el.getAttribute('data-mode');
      renderView();
      break;
    case 'quiz-type':
      state.quizSetup.type = el.getAttribute('data-type'); renderView(); break;
    case 'quiz-count':
      state.quizSetup.count = parseInt(el.getAttribute('data-count'), 10) || 10; renderView(); break;
    case 'quiz-scope':
      state.quizSetup.scope = el.getAttribute('data-scope'); renderView(); break;
    case 'quiz-start': startQuiz(); break;
    case 'quiz-answer': answerQuiz(parseInt(el.getAttribute('data-idx'), 10)); break;
    case 'quiz-next': nextQuestion(); break;
    case 'quiz-restart': state.quiz = null; renderView(); break;
    case 'quiz-exit': state.quiz = null; renderView(); break;
    case 'quiz-again-wrong': {
      var q = state.quiz;
      if(!q) return;
      var wrong = q.questions.filter(function(x){ return x.selected !== x.answer; });
      if(!wrong.length){ toast('没有错题，非常棒'); return; }
      state.session = {kind:'book', words:wrong.map(function(x){ return x.word; }), i:0, revealed:false, stats:{know:0,fuzzy:0,dont:0}, startedAt:Date.now()};
      state.quiz = null;
      state.tab = 'review';
      history.replaceState(null, '', '#review');
      renderView();
      break;
    }
    case 'lib-letter':
      state.lib.letter = el.getAttribute('data-letter'); state.lib.limit = 60; renderView(); break;
    case 'lib-filter':
      state.lib.filter = el.getAttribute('data-filter'); state.lib.limit = 60; renderView(); break;
    case 'lib-more':
      state.lib.limit += 60; renderView(); break;
    case 'open-word': openWord(word); break;
    case 'book-toggle': {
      e.stopPropagation();
      var r = ensureRec(word);
      r.b = !r.b;
      persist();
      if(state.sheet === word) openWord(word);
      renderView();
      toast(r.b ? '已加入生词本' : '已移出生词本');
      break;
    }
    case 'mark-master': {
      var rm = ensureRec(word);
      rm.s = 8; rm.d = Date.now() + INTERVALS[8]*DAY;
      if(!rm.n) rm.n = 1;
      persist();
      if(state.sheet === word) openWord(word);
      renderView();
      toast('已标记为掌握');
      break;
    }
    case 'reset-word': {
      delete records[String(word).toLowerCase()];
      persist();
      if(state.sheet === word) openWord(word);
      renderView();
      toast('该词进度已重置');
      break;
    }
    case 'export-data': exportData(); break;
    case 'import-data': $('#importFile').click(); break;
    case 'reset-all':
      if(confirm('确定清空全部学习记录吗？此操作不可撤销。')){
        records = {}; activity = {}; meta = {goal: meta.goal || 20, quizTotal:0, quizCorrect:0};
        state.session = null; state.quiz = null;
        persist(); renderView(); toast('数据已清空');
      }
      break;
  }
});

document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.key === 'Escape'){
    $('#shareModal').classList.remove('show');
    closeSheet();
    $('#overlay').classList.remove('show');
    return;
  }
  if(state.tab === 'study' && state.session && state.session.i < state.session.words.length){
    if(e.code === 'Space'){
      e.preventDefault();
      if(!state.session.revealed){ state.session.revealed = true; renderView(); }
      return;
    }
    if(state.session.revealed){
      if(e.key === '1') rate('dont');
      else if(e.key === '2') rate('fuzzy');
      else if(e.key === '3') rate('know');
    }
  }
  if(state.tab === 'quiz' && state.quiz && !state.quiz.finished){
    var cur = state.quiz.questions[state.quiz.i];
    if(cur && cur.selected !== null && e.key === 'Enter'){ e.preventDefault(); nextQuestion(); }
  }
});

window.addEventListener('hashchange', function(){
  var h = location.hash.replace('#','');
  var found = TABS.some(function(t){ return t.id === h; });
  if(found && h !== state.tab){ state.tab = h; state.session = null; renderView(); }
});

/* ================= 启动 ================= */
function boot(){
  var h = location.hash.replace('#','');
  if(TABS.some(function(t){ return t.id === h; })) state.tab = h;
  renderNav();
  renderView();
  var b = $('#boot');
  b.classList.add('hide');
  setTimeout(function(){ b.style.display = 'none'; }, 400);
}

if(W.length){
  boot();
}else{
  $('#boot').innerHTML = '<div style="text-align:center;padding:20px"><div class="boot-text">词库加载失败</div><div class="small muted" style="margin-top:8px">请确认 words.js 与本页面在同一目录</div></div>';
}

})();
</script>
</body>
</html>
